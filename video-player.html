<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - MZone</title>
    <meta name="theme-color" content="#8b5cf6">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.8rem; font-weight: 900; }
        .btn-back {
            padding: 0.6rem 1.2rem;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            max-height: 70vh;
        }
        .video-info {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .video-info h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            font-weight: 900;
        }
        .video-meta {
            opacity: 0.9;
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }
        .video-description {
            line-height: 1.7;
            font-size: 1.05rem;
        }
        .playlist {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .playlist h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            font-weight: 900;
        }
        .playlist-item {
            padding: 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            margin-bottom: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .playlist-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }
        .playlist-item.active {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
        }
        .playlist-item h3 {
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
            font-weight: 700;
        }
        .playlist-item p {
            opacity: 0.9;
            font-size: 0.95rem;
        }
        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .video-info h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🎬 MZone</div>
        <a href="dashboard.html" class="btn-back">← Dashboard</a>
    </nav>

    <div class="container">
        <div class="video-container">
            <video id="videoPlayer" controls>
                <source src="" type="video/mp4">
                Your browser does not support video playback.
            </video>
        </div>

        <div class="video-info">
            <h1 id="videoTitle">Video Title</h1>
            <div class="video-meta" id="videoMeta">0 views • Today</div>
            <p class="video-description" id="videoDescription">Video description will appear here</p>
        </div>

        <div class="playlist">
            <h2>📋 Playlist</h2>
            <div id="playlistContainer"></div>
        </div>
    </div>

    <script>
        const videos = [
            {
                id: 1,
                title: "Premium Content - Episode 1",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                views: "1.2K",
                date: "2 days ago",
                description: "This is a sample video for demonstration purposes. Replace with your actual premium content."
            },
            {
                id: 2,
                title: "Premium Content - Episode 2",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                views: "856",
                date: "5 days ago",
                description: "Another sample video for your entertainment. Add your real content here."
            },
            {
                id: 3,
                title: "Premium Content - Episode 3",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                views: "2.1K",
                date: "1 week ago",
                description: "Third sample video in the playlist. Upload your premium videos."
            }
        ];

        let currentVideoIndex = 0;
        const videoPlayer = document.getElementById('videoPlayer');

        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = videos.map((video, index) => `
                <div class="playlist-item ${index === currentVideoIndex ? 'active' : ''}" onclick="playVideo(${index})">
                    <h3>${video.title}</h3>
                    <p>${video.views} views • ${video.date}</p>
                </div>
            `).join('');
        }

        function playVideo(index) {
            currentVideoIndex = index;
            const video = videos[index];
            
            videoPlayer.src = video.url;
            document.getElementById('videoTitle').textContent = video.title;
            document.getElementById('videoMeta').textContent = `${video.views} views • ${video.date}`;
            document.getElementById('videoDescription').textContent = video.description;
            
            renderPlaylist();
            videoPlayer.play();
        }

        videoPlayer.addEventListener('ended', () => {
            if (currentVideoIndex < videos.length - 1) {
                playVideo(currentVideoIndex + 1);
            }
        });

        renderPlaylist();
        playVideo(0);
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
