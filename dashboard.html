<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MZone</title>
    <meta name="theme-color" content="#8b5cf6">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192x192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.8rem; font-weight: 900; }
        .nav-right { display: flex; gap: 1rem; align-items: center; }
        .btn-logout {
            padding: 0.6rem 1.2rem;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }
        .welcome {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 3rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .welcome h1 { 
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            font-weight: 900;
        }
        .welcome p { 
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }
        .stat-card h3 {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 0.8rem;
        }
        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 900;
        }
        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .action-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }
        .action-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .action-card h3 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .action-card p {
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: rgba(255,255,255,0.95);
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .welcome { padding: 2rem; }
            .welcome h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🎬 MZone</div>
        <div class="nav-right">
            <span id="userName">User</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="welcome">
            <h1>Welcome Back! 🎉</h1>
            <p>You have full access to all premium content</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Plan Status</h3>
                <div class="value">✅ Active</div>
            </div>
            <div class="stat-card">
                <h3>Content Available</h3>
                <div class="value">∞ Unlimited</div>
            </div>
            <div class="stat-card">
                <h3>Support</h3>
                <div class="value">24/7</div>
            </div>
        </div>

        <div class="actions">
            <div class="action-card">
                <div class="action-icon">🎬</div>
                <h3>Watch Videos</h3>
                <p>Stream premium video content</p>
                <a href="video-player.html" class="btn">Start Watching</a>
            </div>
            <div class="action-card">
                <div class="action-icon">⬇️</div>
                <h3>Download Content</h3>
                <p>Download unlimited content offline</p>
                <a href="#" class="btn">Browse Library</a>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('mzone_token');
        const user = JSON.parse(localStorage.getItem('mzone_user') || '{}');

        if (!token || !user.isSubscribed) {
            window.location.href = 'pricing.html';
        }

        document.getElementById('userName').textContent = user.fullName || user.email || 'User';

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
    <script src="pwa-register.js"></script>
</body>
</html>
